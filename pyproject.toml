[project]
name = "faststream-redis-timers"
version="0"
description = "FastStream integration for Redis-backed distributed timer scheduling"
authors = [
    { name = "Artur Shiriev", email = "me@shiriev.ru" },
]
readme = "README.md"
requires-python = ">=3.11,<4"
license = "MIT"
keywords = ["faststream", "redis", "scheduler", "timers", "distributed", "messaging", "asyncio", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "faststream>=0.7.1,<0.8",
    "redis>=5.0",
    "typing-extensions>=4.12.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]
lint = [
    "ruff",
    "ty",
    "eof-fixer",
    "types-redis",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "faststream_redis_timers"
module-root = ""

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",     # docstrings are not forced; a docstring exists when it says something
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "CPY001", # no per-file copyright header
    "FBT",    # boolean positional arguments are fine
    "TCH",    # imports stay real; TYPE_CHECKING-only imports break runtime introspection
    "ANN",    # typing.Any is the honest annotation at the FastStream broker boundary
]
isort.lines-after-imports = 2
isort.no-lines-before = ["standard-library", "local-folder"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = [
    "S101", # allow asserts
    "PLR2004", # allow magic values
]

[tool.pytest.ini_options]
addopts = ""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.urls]
Homepage = "https://faststream-redis-timers.modern-python.org"
Documentation = "https://faststream-redis-timers.modern-python.org"
Repository = "https://github.com/modern-python/faststream-redis-timers"
Issues = "https://github.com/modern-python/faststream-redis-timers/issues"
Changelog = "https://github.com/modern-python/faststream-redis-timers/releases"

[tool.coverage.report]
fail_under = 100
exclude_also = ["if typing.TYPE_CHECKING:"]
